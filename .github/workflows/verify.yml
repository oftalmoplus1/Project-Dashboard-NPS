name: Validacao do Dashboard
on:
  push:
    branches:
      - feature/visao-geral-chamadas
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verificar:
    # Pin the runner supported by the pinned browser toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Relatorio de dependencias de desenvolvimento
        continue-on-error: true
        run: npm audit --json
      - run: node --test tests/call-data.test.mjs tests/call-center-design.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Validar rotas HTTP com Supabase simulado
        run: node tests/smoke-http.mjs
      - name: Instalar navegador isolado para testes de interface
        run: |
          npm install --prefix "$RUNNER_TEMP/callcenter-browser" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/callcenter-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Validar design responsivo e navegacao com dados sinteticos
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/callcenter-browser/node_modules/playwright/index.mjs" node tests/smoke-call-center-design.mjs
      - name: Guardar capturas da interface de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-center-design-${{ github.sha }}
          path: artifacts/call-center-design
          if-no-files-found: ignore
          retention-days: 7
