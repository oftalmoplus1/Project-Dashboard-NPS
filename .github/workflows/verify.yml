name: Validacao do Dashboard
on:
  push:
    branches:
      - feature/visao-geral-chamadas
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verificar:
    # Pin the runner supported by the pinned browser toolchain.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Auditar dependencias de producao
        run: npm audit --omit=dev --audit-level=high
      - name: Relatorio de dependencias de desenvolvimento
        continue-on-error: true
        run: npm audit --json
      - run: node --test tests/call-data.test.mjs tests/call-center-design.test.mjs tests/ligsim-reports.test.mjs tests/queue-snapshot.test.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Validar rotas HTTP com Supabase simulado
        run: node tests/smoke-http.mjs
      - name: Validar CRUD e inventario administrativo com Supabase simulado
        run: node tests/smoke-admin-catalog.mjs
      - name: Validar criacao de rascunhos personalizados com Supabase simulado
        run: node tests/smoke-dashboard-drafts.mjs
      - name: Verificar catalogo administrativo de fontes sem acesso a tabelas
        run: node tests/smoke-editor-source-catalog.mjs
      - name: Reutilizar navegador da versao fixada
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-headless-ubuntu24-playwright-1.56.1
      - name: Instalar navegador isolado para testes de interface
        timeout-minutes: 4
        env:
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: '30000'
        run: |
          npm install --prefix "$RUNNER_TEMP/callcenter-browser" --no-package-lock --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1 playwright@1.56.1
          # Required runtime libraries are supplied by the pinned Ubuntu runner.
          # Missing libraries still fail the mandatory browser launch below.
          node "$RUNNER_TEMP/callcenter-browser/node_modules/playwright/cli.js" install chromium --only-shell
      - name: Validar design responsivo e navegacao com dados sinteticos
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/callcenter-browser/node_modules/playwright/index.mjs" node tests/smoke-call-center-design.mjs
      - name: Validar editor visual com autenticacao simulada
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/callcenter-browser/node_modules/playwright/index.mjs" node tests/smoke-visual-editor.mjs
      - name: Guardar capturas da interface de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: call-center-design-${{ github.sha }}
          path: artifacts/call-center-design
          if-no-files-found: ignore
          retention-days: 7

  validar-sql-rascunhos:
    # PostgreSQL isolado, com papeis/usuario sinteticos.
    # Nenhuma credencial ou URL de Supabase de producao.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:15.8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-only
          POSTGRES_DB: dashboard_drafts_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dashboard_drafts_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: dashboard_drafts_ci
      PGPASSWORD: ci-postgres-only
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PostgreSQL
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Executar migracao no banco temporario e testar RBAC, rollback e concorrencia
        run: bash tests/sql/run-dashboard-drafts.sh
